name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        id: espruino
        with:
          path: tests/espruino/bin
          key: espruino-${{ hashFiles('tests/espruino/build-espruino.sh', 'tests/espruino/espruino-shelly.patch') }}
      - if: steps.espruino.outputs.cache-hit != 'true'
        run: tests/espruino/build-espruino.sh
      - run: npm run test:memory
